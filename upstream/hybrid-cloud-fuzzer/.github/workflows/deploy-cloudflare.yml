name: Deploy Cloudflare (main)
on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'migrations/**'
      - 'wrangler.toml'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/deploy-cloudflare.yml'
  workflow_dispatch:

permissions:
  contents: read

# Use this deployer instead of competing Cloudflare Builds (one production owner).
concurrency:
  group: hybrid-cloud-fuzzer-production
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ vars.ENABLE_CF_GITHUB_DEPLOY == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Ensure deploy credentials exist
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "::error::Missing CLOUDFLARE_API_TOKEN repository secret"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "::error::Missing CLOUDFLARE_ACCOUNT_ID repository secret"; exit 1; }
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
      - name: Validate source and D1 contracts
        run: |
          npm run check
          npm test
      - name: Apply additive D1 migrations before Worker publish
        run: npx wrangler d1 migrations apply hybrid-cloud-fuzzer --remote
      - name: Deploy only the tested main commit
        run: npx wrangler deploy
      - name: Verify production Worker and schema
        env:
          HEALTH_URL: https://hybrid-cloud-fuzzer.braian-n-l.workers.dev/health
        run: |
          for attempt in $(seq 1 12); do
            if curl --fail --silent --show-error --max-time 12 "$HEALTH_URL" -o /tmp/hybrid-health.json; then
              if jq -e '.ok == true and .schemaVersion >= 4 and .workforceReady == true and .pacingReady == true' /tmp/hybrid-health.json >/dev/null; then
                echo "Production healthy; D1 schema >= 4, workforce and provider pacing ready"
                exit 0
              fi
            fi
            sleep 5
          done
          echo "::error::Production deployment is not healthy at schema >= 4 with provider pacing"
          exit 1
