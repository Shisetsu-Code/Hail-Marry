<!doctype html><html lang="es"><meta charset="utf-8"><title>Guided demo fixture</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#111d35;color:#fff;font:22px sans-serif;width:100vw;height:100vh;overflow:hidden;background-image:repeating-linear-gradient(35deg,transparent 0 40px,#173151 41px 80px)}h1{margin:45px}button{width:180px;height:75px;color:#fff;background:linear-gradient(135deg,#267e98,#7339a3);border:5px solid #f2c45e;font:20px sans-serif;border-radius:15px;position:absolute}#continue{left:550px;top:430px}#spin{left:1000px;top:600px}#ante{left:70px;top:600px}#menu{left:300px;top:600px}#menu2{left:520px;top:600px}#option{left:350px;top:300px}#nested{left:600px;top:300px}#confirm{left:350px;top:430px}#cancel,#back{left:650px;top:430px}#cover{position:absolute;inset:0;background:rgba(0,0,0,.01);z-index:100;display:none}#ante-state{position:absolute;top:200px;left:40px;width:700px;height:250px;font-size:60px;background:#281c47;padding:40px}
</style>
<h1 id="title">Demo introduction</h1><div id="controls"></div><div id="cover"></div>
<script>
window.inputs=[];window.screenName='intro';window.ante=false;
const buttons={intro:[['continue','Continuar','base']],base:[['spin','Girar','result'],['ante','Antebet','ante'],['menu','Comprar','menu'],['menu2','Otra compra','menu2']],menu:[['option','Comprar opción','confirm'],['nested','Más opciones','nested'],['back','Volver','base']],menu2:[['option','Compra directa','confirm'],['back','Volver','base']],nested:[['option','Opción anidada','confirm'],['back','Volver','menu']],confirm:[['confirm','Confirmar','purchased'],['cancel','Cancelar','base']],result:[],purchased:[]};
window.render=(name)=>{window.screenName=name;document.querySelector('#title').textContent=name;document.querySelector('#controls').replaceChildren();for(const[id,label,next]of buttons[name]||[]){const button=document.createElement('button');button.id=id;button.textContent=label;button.onclick=()=>{inputs.push(id);if(next==='ante'){ante=!ante;const old=document.querySelector('#ante-state');if(old)old.remove();else{const el=document.createElement('div');el.id='ante-state';el.textContent='ANTE ACTIVADO';document.body.append(el)}}else render(next)};document.querySelector('#controls').append(button)}};render('intro');
</script></html>
