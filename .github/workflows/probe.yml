name: Dynamic controls experiment

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'python/**'
      - 'scripts/**'
      - 'tests/**'
      - 'fixtures/**'
      - 'config/**'
      - 'package*.json'
      - 'requirements-laya.txt'
      - '.github/workflows/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hail-marry-experiment
  cancel-in-progress: true

jobs:
  cpu-probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      USE_TF: '0'
      USE_TORCH: '1'
      TOKENIZERS_PARALLELISM: 'false'
      HF_HUB_DISABLE_TELEMETRY: '1'
      OMP_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-laya.txt
      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: laya-multilingual-1720e3e3357cfe1e281542e223f8273b0890ca34
      - name: Install Chromium and OCR
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          sudo apt-get update -qq
          sudo apt-get install -y tesseract-ocr tesseract-ocr-eng
          npx playwright install-deps chromium
          npx playwright install chromium || python scripts/install-browser-fallback.py
      - name: Unit and browser regression tests
        run: |
          mkdir -p artifacts
          npm test 2>&1 | tee artifacts/tests.log
          python -m unittest discover -s python -p 'test_*.py' -v 2>&1 | tee artifacts/python-tests.log
      - name: Install pinned CPU Laya
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch==2.8.0+cpu --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements-laya.txt
          python -m pip check
          python -m pip freeze > artifacts/python-environment.txt
      - name: Start real local Laya model
        run: |
          python -u python/laya_server.py --port 8765 --threads 2 --min-confidence 0.80 --max-state-tokens 512 > artifacts/laya-server.log 2>&1 &
          echo $! > artifacts/laya.pid
          node scripts/wait-laya.mjs || { cat artifacts/laya-server.log; exit 1; }
      - name: Verify real model inference
        run: npm run test:laya 2>&1 | tee artifacts/laya-smoke.log
      - name: Verify 60-second load and dynamic action cycle
        run: npm run test:integration 2>&1 | tee artifacts/integration.log
      - name: Observe three public demos concurrently
        run: npm run probe -- --config config/demos.json --concurrency 3 2>&1 | tee artifacts/live.log
      - name: Report measured results
        if: always()
        run: node scripts/summary.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hail-marry-evidence
          path: artifacts/
          retention-days: 14
          if-no-files-found: error
      - name: Stop local inference service
        if: always()
        run: |
          python - <<'PY'
          from pathlib import Path
          import os, signal
          p = Path('artifacts/laya.pid')
          if p.exists():
              try: os.kill(int(p.read_text().strip()), signal.SIGTERM)
              except ProcessLookupError: pass
          PY
