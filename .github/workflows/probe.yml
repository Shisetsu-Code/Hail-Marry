name: Dynamic controls experiment

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'python/**'
      - 'scripts/**'
      - '!scripts/start-classifier.mjs'
      - '!scripts/hold-classifier.mjs'
      - 'tests/**'
      - 'fixtures/**'
      - 'config/**'
      - '!config/classifier-session.json'
      - 'package*.json'
      - 'requirements-laya.txt'
      - 'requirements-ocr.txt'
      - '.github/workflows/probe.yml'
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: hail-marry-experiment
  cancel-in-progress: true

jobs:
  cpu-probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      USE_TF: '0'
      USE_TORCH: '1'
      TOKENIZERS_PARALLELISM: 'false'
      HF_HUB_DISABLE_TELEMETRY: '1'
      OMP_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            requirements-laya.txt
            requirements-ocr.txt
      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: laya-multilingual-1720e3e3357cfe1e281542e223f8273b0890ca34
      - name: Install Node dependencies and Tesseract
        timeout-minutes: 5
        run: |
          mkdir -p artifacts
          # The Azure APT mirror delivered only 44 kB/s in the previous runner.
          # Keep the signed Ubuntu repositories, using Ubuntu's own archive host.
          sudo python3 - <<'PY'
          from pathlib import Path
          import re
          files = [Path('/etc/apt/sources.list'), Path('/etc/apt/apt-mirrors.txt'), *Path('/etc/apt/sources.list.d').glob('*.list'), *Path('/etc/apt/sources.list.d').glob('*.sources')]
          for source in files:
              if not source.is_file():
                  continue
              current = source.read_text()
              updated = re.sub(r'https?://azure\.archive\.ubuntu\.com(?=/|\s|$)', 'https://archive.ubuntu.com', current)
              if updated != current:
                  source.write_text(updated)
                  print('Using Ubuntu archive in ' + source.name)
          PY
          npm ci --ignore-scripts --no-audit --no-fund 2>&1 | tee artifacts/install-node.log
          sudo apt-get update -qq 2>&1 | tee artifacts/install-apt-update.log
          sudo apt-get install -y tesseract-ocr tesseract-ocr-eng 2>&1 | tee artifacts/install-tesseract.log
      - name: Install OCR preprocessing
        timeout-minutes: 2
        run: |
          python -m pip install --disable-pip-version-check --timeout 30 --only-binary=:all: -r requirements-ocr.txt 2>&1 | tee artifacts/install-pillow.log
      - name: Install browser system dependencies
        timeout-minutes: 5
        run: npx playwright install-deps chromium 2>&1 | tee artifacts/install-browser-deps.log
      - name: Download Chromium with bounded mirror fallback
        timeout-minutes: 4
        run: |
          { timeout 90s npx playwright install chromium || timeout 90s python scripts/install-browser-fallback.py; } 2>&1 | tee artifacts/install-chromium.log
      - name: Unit and browser regression tests
        run: |
          mkdir -p artifacts
          npm test 2>&1 | tee artifacts/tests.log
          python -m py_compile python/laya_server.py python/ocr_preprocess.py 2>&1 | tee artifacts/python-syntax.log
      - name: Install pinned CPU Laya
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch==2.8.0+cpu --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements-laya.txt
          python -m pip check
          python -m pip freeze > artifacts/python-environment.txt
      - name: Start real local Laya model
        id: laya-start
        run: |
          python -u python/laya_server.py --port 8765 --threads 2 --min-confidence 0.80 --max-state-tokens 512 > artifacts/laya-server.log 2>&1 &
          echo $! > artifacts/laya.pid
          node scripts/wait-laya.mjs || { cat artifacts/laya-server.log; exit 1; }
      - name: Verify real model inference
        run: npm run test:laya 2>&1 | tee artifacts/laya-smoke.log
      - name: Save model decision diagnostics
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() && steps.laya-start.outcome == 'success' }}
        with:
          name: laya-decision-diagnostics
          path: |
            artifacts/laya-smoke.json
            artifacts/laya-smoke.log
          retention-days: 14
          if-no-files-found: error
      - name: Verify 60-second load and dynamic action cycle
        if: ${{ !cancelled() && steps.laya-start.outcome == 'success' }}
        run: npm run test:integration 2>&1 | tee artifacts/integration.log
      - name: Observe three public demos concurrently
        if: ${{ !cancelled() && steps.laya-start.outcome == 'success' }}
        run: npm run probe -- --config config/demos.json --concurrency 3 2>&1 | tee artifacts/live.log
      - name: Report measured results
        if: always()
        run: node scripts/summary.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hail-marry-evidence
          path: artifacts/
          retention-days: 14
          if-no-files-found: error
      - name: Stop local inference service
        if: always()
        run: |
          python - <<'PY'
          from pathlib import Path
          import os, signal
          p = Path('artifacts/laya.pid')
          if p.exists():
              try: os.kill(int(p.read_text().strip()), signal.SIGTERM)
              except ProcessLookupError: pass
          PY
